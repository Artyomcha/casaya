name: CI

on:
  push:
    branches: [main]
  pull_request:

# Параллельные прогоны одной ветки не нужны: отменяем предыдущий.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Типы, сборка, тесты
    runs-on: ubuntu-latest

    # База нужна по-настоящему: сквозные тесты ходят в поднятый API,
    # а не в заглушки, иначе проверка доступа ничего не доказывает.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: casaya
          POSTGRES_PASSWORD: casaya
          POSTGRES_DB: casaya
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U casaya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://casaya:casaya@localhost:5433/casaya
      # Порт берётся из .env, которого в репозитории нет: без него API
      # слушал 4000, а проверка стучалась в 4100 и не дожидалась.
      PORT: '4100'
      API_URL: http://localhost:4100/api
      WEB_ORIGIN: http://localhost:3100
      # Пропуск сквозных тестов на CI — это зелёный прогон ни о чём.
      REQUIRE_API: '1'
      # Короче 16 символов API в проде не примет, в CI держим ту же планку.
      AUTH_SECRET: ci-secret-at-least-16-chars

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Клиент Prisma
        run: npm run prisma:generate --workspace apps/api

      - name: Типы API
        run: npx tsc --noEmit --project apps/api

      - name: Типы портала
        run: npx tsc --noEmit --project apps/web

      - name: Типы приложения
        run: npx tsc --noEmit --project apps/mobile

      - name: Миграции и демо-данные
        run: |
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
          npm run prisma:seed --workspace apps/api

      - name: Сборка API
        run: npm run build --workspace apps/api

      # Запуск и тесты одним шагом: фоновый процесс из соседнего шага
      # в Actions не переживает завершение его оболочки.
      - name: Тесты со сквозными
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          api=$!
          for i in $(seq 1 40); do
            curl -sf "$API_URL/health" >/dev/null && break
            sleep 2
          done
          if ! curl -sf "$API_URL/health" >/dev/null; then
            echo "API не поднялся, его вывод:"; cat /tmp/api.log; kill $api; exit 1
          fi
          # Actions выполняет шаг с set -e: без || падение теста оборвало бы
          # скрипт до остановки API, и код возврата потерялся бы.
          npm test --workspace apps/api || code=$?
          kill $api 2>/dev/null || true
          exit ${code:-0}

      - name: Сборка портала
        run: npm run build --workspace apps/web
